<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidekick microphone access</title>
  <style>
    @font-face { font-family: "Inter"; src: url("/vendor/inter.woff2") format("woff2"); font-weight: 100 900; }
    :root { --bg: #fff; --text: #0d0d0d; --muted: #6b6b6b; --beige: #e8dcc4; --beige-hover: #ddcdae; --beige-text: #2a2117; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #212121; --text: #ececec; --muted: #a8a8a8; --beige: #ddceb0; --beige-hover: #e9dcc2; --beige-text: #1d1912; color-scheme: dark; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 15px/1.6 "Inter", -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 380px; padding: 24px; text-align: center; }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 22px; }
    button { font: inherit; font-weight: 500; border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer;
             background: var(--beige); color: var(--beige-text); }
    button:hover { background: var(--beige-hover); }
    #status { margin-top: 18px; min-height: 1.6em; }
  </style>
</head>
<body>
  <main>
    <h1>Allow microphone for Sidekick</h1>
    <p>Chrome can't show the permission prompt inside the side panel, so it's asked here once. Audio is only used while you dictate.</p>
    <button id="allow" type="button">Allow microphone</button>
    <div id="status" role="status"></div>
  </main>
  <script type="module" src="../ui/mic/mic.js"></script>
</body>
</html>
