<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sidekick · Quality checks</title>
  <link rel="stylesheet" href="profile.css" />
  <style>
    main { max-width: 820px; margin: 0 auto; padding: 28px 24px 80px; }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; }
    table { margin-top: 18px; }
    td { vertical-align: top; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); margin-top: 6px; }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--err); }
    .dot.run { background: #c8a96a; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .t { font-weight: 500; }
    .note { max-width: 330px; overflow-wrap: anywhere; }
    .meta { white-space: nowrap; }
    tr.out pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--surface); border-radius: 10px; padding: 10px; margin: 0; }
    .summary { margin-top: 16px; padding: 10px 14px; border-radius: 12px; background: var(--surface); }
    .summary.good { color: var(--ok); }
    .summary.bad { color: var(--err); }
    .summary:empty { display: none; }
    #history { padding-left: 18px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="12" rx="9" ry="4.2"/><ellipse cx="12" cy="12" rx="9" ry="4.2" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="4.2" transform="rotate(120 12 12)"/></g></svg>
      <span>Quality checks</span>
    </div>
    <a class="small" style="color:inherit" href="options.html">← Settings</a>
  </header>
  <main>
    <h1>Quality checks</h1>
    <p class="muted">Runs real conversations through Sidekick with your current settings and grades the answers automatically. It uses your API key (roughly a few cents per run) and a temporary memory, so your real memories aren't touched. Aim for at least 85%.</p>
    <p class="small muted" id="config"></p>
    <div class="row"><button id="run" class="primary" type="button">Run all checks</button></div>
    <div id="summary" class="summary"></div>
    <table><tbody id="cases"></tbody></table>
    <section class="card" style="margin-top:28px">
      <h2>Past runs</h2>
      <ul id="history"></ul>
    </section>
  </main>
  <script src="ai.js"></script>
  <script src="guard.js"></script>
  <script src="profile-core.js"></script>
  <script src="memory.js"></script>
  <script src="skills.js"></script>
  <script src="docs.js"></script>
  <script src="web.js"></script>
  <script src="screen.js"></script>
  <script src="calc.js"></script>
  <script src="session.js"></script>
  <script src="brain.js"></script>
  <script src="evals.js"></script>
</body>
</html>
